[project]
name = "halcon-doc-skills"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AllenSu0808", email = "scps950607@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "playwright>=1.63.0",
]

[project.scripts]
halcon-doc-skills = "halcon_doc_skills:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: 需要 Playwright Chromium 的測試"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["docs"]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

